name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Build docker image
      run:
        docker build -t events-api:latest --platform linux/amd64 .

    - name: Run container
      run: |
        docker run -d -p 5000:5000 --name events-api-container events-api:latest
        sleep 5
        curl http://localhost:5000/api/health || exit 1

    - name: Setup python
      uses: actions/setup-python@v5

    - name: Install dependencies
      run:
        pip install -r requirements.txt

    - name: Run test against container
      run:
        pytest -v

    - name: Stop and remove container
      if: ${{ always() }}
      run: |
        docker stop events-api-container || true
        docker rm events-api-container || true

    - name: Login to Dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag docker image
      run:
        docker tag events-api:latest mcondesso/events-api:latest
        docker tag events-api:latest mcondesso/events-api:${{ github.sha }}

    - name: Push to Dockerhub
      run:
        docker push mcondesso/events-api:latest
        docker push mcondesso/events-api:${{ github.sha }}
    
    - name: Trigger Render redeployment
      run:
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}